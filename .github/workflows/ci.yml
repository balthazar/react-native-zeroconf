name: CI

on:
  push:
    branches: [master, '1.0']
    paths-ignore: ['docs/**', 'website/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', 'website/**', '**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, tests and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn typecheck
      - run: yarn build
      - name: Check the published files
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "lib/module/index.js" pack.txt
          grep -q "lib/typescript/src/index.d.ts" pack.txt
          if grep -qE "docs/|website/|test/|mDNSWindows" pack.txt; then
            echo "Unexpected files in the package"
            exit 1
          fi

  ios-native:
    name: iOS implementation (macOS harness)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: test/apple/run.sh

  embedded:
    name: Android DNSSD backend (Linux harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test/embedded/run.sh

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Pack the library
        run: |
          yarn install --frozen-lockfile
          yarn build
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the example with the packed library
        working-directory: example
        run: |
          npm ci
          rm -rf node_modules/react-native-zeroconf
          mkdir -p node_modules/react-native-zeroconf
          tar -xzf "$RUNNER_TEMP"/react-native-zeroconf-*.tgz -C node_modules/react-native-zeroconf --strip-components=1
      - name: Type check the example
        working-directory: example
        run: npm run typecheck
      - name: Build
        working-directory: example
        run: |
          npx expo prebuild --platform android --no-install
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties
          cd android && ./gradlew :app:assembleDebug --build-cache -PreactNativeArchitectures=x86_64

  ios:
    name: iOS app (simulator self-test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pack the library
        run: |
          yarn install --frozen-lockfile
          yarn build
          npm pack --pack-destination "$RUNNER_TEMP"
      # The example with the packed library and test/app/App.tsx, which runs the JavaScript API against
      # test/app/peer.py and reports through a _zcresult._tcp service that test/app/check-app.py waits for
      - name: Install the example with the packed library and the self-test
        working-directory: example
        run: |
          npm ci
          rm -rf node_modules/react-native-zeroconf
          mkdir -p node_modules/react-native-zeroconf
          tar -xzf "$RUNNER_TEMP"/react-native-zeroconf-*.tgz -C node_modules/react-native-zeroconf --strip-components=1
          cp ../test/app/App.tsx App.tsx
          node -e "
            const fs = require('fs')
            const app = JSON.parse(fs.readFileSync('app.json'))
            app.expo.ios.infoPlist.NSBonjourServices.push('_zcpeer._tcp', '_zcghost._tcp', '_zcapp._tcp', '_zcresult._tcp')
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2))
          "
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ hashFiles('example/package-lock.json') }}
          restore-keys: cocoapods-
      - name: Prebuild (installs pods)
        working-directory: example
        run: npx expo prebuild --platform ios
      - name: Build for a simulator
        working-directory: example/ios
        run: |
          set -o pipefail
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"
          xcodebuild -workspace ZeroconfBrowser.xcworkspace -scheme ZeroconfBrowser \
            -configuration Release -sdk iphonesimulator -destination "id=$SIMULATOR" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcodebuild.log" || { grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -30; tail -30 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/xcodebuild.log"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install a second mDNS stack for the self-test
        run: pip install zeroconf
      - name: Run the self-test app and check its result
        working-directory: example/ios
        run: |
          python "$GITHUB_WORKSPACE/test/app/peer.py" &
          xcrun simctl boot "$SIMULATOR"
          xcrun simctl bootstatus "$SIMULATOR" -b
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$SIMULATOR" "$APP"
          xcrun simctl launch "$SIMULATOR" "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          python "$GITHUB_WORKSPACE/test/app/check-app.py"

  # macOS and tvOS run the iOS self-test (test/app) in apps made from the react-native-macos and
  # react-native-tvos templates, against the same peer
  macos:
    name: macOS app (self-test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pack the library
        run: |
          yarn install --frozen-lockfile
          yarn build
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Create a react-native-macos app with the packed library and the self-test
        working-directory: ${{ runner.temp }}
        run: |
          npx -y @react-native-community/cli@20 init ZeroconfMac --version 0.83.10 --skip-install --skip-git-init --pm npm
          cd ZeroconfMac
          npm install
          npx -y react-native-macos-init@2
          npm install --legacy-peer-deps "$RUNNER_TEMP"/react-native-zeroconf-*.tgz
          cp "$GITHUB_WORKSPACE/test/app/App.tsx" App.tsx
          python3 "$GITHUB_WORKSPACE/test/app/apple-app.py" macos/ZeroconfMac-macOS
      # React Native compiled from source is most of the build: ccache keeps it between runs
      - name: Install ccache
        run: brew install ccache
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ github.run_id }}
          restore-keys: ccache-macos-
      - name: Build
        working-directory: ${{ runner.temp }}/ZeroconfMac/macos
        run: |
          USE_CCACHE=1 pod install
          # The runner's architecture only
          xcodebuild -workspace ZeroconfMac.xcworkspace -scheme ZeroconfMac-macOS -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- ONLY_ACTIVE_ARCH=YES build > "$RUNNER_TEMP/xcodebuild.log" || { grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -30; tail -30 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/xcodebuild.log"
          ccache -s
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install a second mDNS stack for the self-test
        run: pip install zeroconf
      - name: Run the self-test app and check its result
        working-directory: ${{ runner.temp }}/ZeroconfMac/macos
        run: |
          python "$GITHUB_WORKSPACE/test/app/peer.py" &
          # The binary itself rather than open, for its output in this log
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          "$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Contents/Info.plist")" > "$RUNNER_TEMP/app.log" 2>&1 &
          # macOS asks for the Local Network permission on the app's first mDNS call: allow it
          sleep 15
          screencapture -x "$RUNNER_TEMP/prompt.png" || true
          for _ in 1 2 3 4 5 6; do
            osascript -e 'tell application "System Events" to tell process "UserNotificationCenter" to click button "Allow" of window 1' && break
            sleep 5
          done || true
          python "$GITHUB_WORKSPACE/test/app/check-app.py"
      - name: Show the app's output
        if: failure()
        working-directory: ${{ runner.temp }}
        run: |
          screencapture -x after.png || true
          tail -80 app.log || true
          for report in ~/Library/Logs/DiagnosticReports/ZeroconfMac*; do [ -f "$report" ] && head -80 "$report"; done || true
          log show --last 10m --style compact --predicate 'process == "ZeroconfMac" OR eventMessage CONTAINS[c] "ZeroconfMac"' | tail -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screens
          path: ${{ runner.temp }}/*.png

  tvos:
    name: tvOS app (simulator self-test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pack the library
        run: |
          yarn install --frozen-lockfile
          yarn build
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Create a react-native-tvos app with the packed library and the self-test
        working-directory: ${{ runner.temp }}
        run: |
          npx -y @react-native-community/cli@20 init ZeroconfTV --template @react-native-tvos/template-tv@0.83.0-0 --skip-install --skip-git-init --pm npm
          cd ZeroconfTV
          # The template's 0.83.0 does not build with Xcode 26, the latest 0.83 patch does
          npm pkg set dependencies.react-native=npm:react-native-tvos@0.83.10-1
          npm install
          npm install --legacy-peer-deps "$RUNNER_TEMP"/react-native-zeroconf-*.tgz
          cp "$GITHUB_WORKSPACE/test/app/App.tsx" App.tsx
          python3 "$GITHUB_WORKSPACE/test/app/apple-app.py" ios/ZeroconfTV
      # React Native compiled from source is most of the build: ccache keeps it between runs
      - name: Install ccache
        run: brew install ccache
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-tvos-${{ github.run_id }}
          restore-keys: ccache-tvos-
      - name: Build for a simulator
        working-directory: ${{ runner.temp }}/ZeroconfTV/ios
        run: |
          USE_CCACHE=1 pod install
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k, v in d.items() if 'tvOS' in k for x in v if x['name'].startswith('Apple TV')))")
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"
          xcodebuild -workspace ZeroconfTV.xcworkspace -scheme ZeroconfTV -configuration Release \
            -sdk appletvsimulator -destination "id=$SIMULATOR" -derivedDataPath build \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcodebuild.log" || { grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -30; tail -30 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/xcodebuild.log"
          ccache -s
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install a second mDNS stack for the self-test
        run: pip install zeroconf
      - name: Run the self-test app and check its result
        working-directory: ${{ runner.temp }}/ZeroconfTV/ios
        run: |
          python "$GITHUB_WORKSPACE/test/app/peer.py" &
          xcrun simctl boot "$SIMULATOR"
          xcrun simctl bootstatus "$SIMULATOR" -b
          APP=$(find build/Build/Products/Release-appletvsimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$SIMULATOR" "$APP"
          xcrun simctl launch "$SIMULATOR" "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          python "$GITHUB_WORKSPACE/test/app/check-app.py"
